name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run Black (check mode)
        run: uv run black --check .

      - name: Run Tests
        run: uv run pytest -q
